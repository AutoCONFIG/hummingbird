# rsplab.hyhy.fun 反代 —— 增量片段，粘进单体 nginx.conf（不要按 conf.d include，
# 否则与主配置的 map $http_upgrade / map $is_valid_domain / 80 default_server 冲突）
#
# 共三处修改：
#   1. http{} 里 "map $host $is_valid_domain" 域名白名单加一行（不加的话
#      HTTP 访问会被 80 default_server 踢到 ban.hyhy.fun）
#   2. "Upstream 定义" 小节加一行
#   3. server 块加在 github.hyhy.fun 之后
#
# 前提：/var/www/.cert 证书是 *.hyhy.fun 通配符（其他子域共用同一对证书文件）；
#       DNS 已把 rsplab.hyhy.fun 指到本机。

# ===== 1. map $host $is_valid_domain 白名单里加（pan 和 search 之间）=====
#         "rsplab.hyhy.fun"   1;

# ===== 2. Upstream 定义小节里加 =====
# hummingbird-core WebServer，docker-compose 映射 "1080:3000"
upstream backend_rsplab     { server 127.0.0.1:1080; keepalive 64; zone backend_rsplab 64k; }

# ===== 3. server 块（加在 "# 14. github.hyhy.fun" 之后）=====
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    server_name rsplab.hyhy.fun;

    access_log /var/log/nginx/rsplab.access.log detailed buffer=64k flush=5s;
    error_log /var/log/nginx/rsplab.error.log warn;

    ssl_certificate /var/www/.cert/fullchain.pem;
    ssl_certificate_key /var/www/.cert/key.pem;

    error_page 497 = @error;
    error_page 502 504 = @error_502;

    # 固件/驱动包上传（全局 32G 太宽，按站点收紧，按需调大）
    client_max_body_size 100m;

    proxy_set_header Host "rsplab.hyhy.fun";
    proxy_set_header X-Forwarded-Host "rsplab.hyhy.fun";

    if ($crawler_block) { return 403; }

    # API 接口（无缓存）
    location ~ ^/api/ {
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_read_timeout 300s;
        proxy_pass http://backend_rsplab;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        proxy_cache static_cache;
        proxy_cache_key "$host$uri";
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        proxy_pass http://backend_rsplab;
        access_log off;
    }

    # 主应用。WebSocket 不用单独配：http{} 全局已设
    # proxy_set_header Upgrade/Connection $connection_upgrade，
    # map 会按 $http_upgrade 自动升级
    location / {
        access_log /var/log/nginx/crawler.log crawler if=$is_crawler;
        proxy_pass http://backend_rsplab;
    }

    location @error { return 308 https://$http_host$request_uri; }
    location @error_502 { access_log /var/log/nginx/rsplab.error_502.log error_502 buffer=16k flush=1s; return 502; }
    location = /robots.txt { add_header Content-Type text/plain; return 200 $robots_txt; }
}
