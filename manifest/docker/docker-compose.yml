networks:
  hummingbird:
    driver: bridge
services:
  mqtt-broker:
    image: registry.cn-shanghai.aliyuncs.com/winc-link/mqtt-broker:2.6
    container_name: mqtt-broker
    hostname: mqtt-broker
    restart: always
    ports:
      - "58090:58090"
    networks:
      - hummingbird
  ekuiper:
    image: registry.cn-shanghai.aliyuncs.com/winc-link/ekuiper:1.10.0-slim
    ports:
      - "127.0.0.1:9081:9081"
    container_name: ekuiper
    hostname: ekuiper
    restart: always
    user: root
    volumes:
      - ./kuiper/data:/kuiper/data
      - ./kuiper/log:/kuiper/log
    environment:
      MQTT_SOURCE__DEFAULT__SERVER: "tcp://mqtt-broker:58090"
      KUIPER__BASIC__CONSOLELOG: "true"
      KUIPER__BASIC__IGNORECASE: "false"
    networks:
      - hummingbird
  postgres:
    # 元数据库（可选，默认仍用内置 SQLite；启用方式见 config/configuration.toml 的 postgres 注释项）
    # 公网暴露面：仅内网，不映射宿主机端口
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: postgres
    hostname: postgres
    restart: always
    environment:
      POSTGRES_USER: hummingbird
      POSTGRES_PASSWORD: hummingbird   # 生产环境务必改为强密码
      POSTGRES_DB: hummingbird
    volumes:
      - ./db-data/postgres-data:/var/lib/postgresql/data
    networks:
      - hummingbird
  tdengine:
    # 时序数据库（设备数据；启用方式见 config/configuration.toml 的 tdengine 注释项）
    # 版本对齐：go.mod driver-go/v3 v3.5.0 ↔ TDengine 3.1.x（变更需回归 datadb 链路）
    # 公网暴露面：仅内网，不映射宿主机端口
    image: docker.m.daocloud.io/tdengine/tdengine:3.1.1.0
    container_name: tdengine
    hostname: tdengine
    restart: always
    volumes:
      - ./db-data/tdengine-data:/var/lib/taos
    networks:
      - hummingbird
  hummingbird-core:
    image: registry.cn-shanghai.aliyuncs.com/winc-link/hummingbird-core:v1.0
    container_name: hummingbird-core
    restart: always
    hostname: hummingbird-core
    ports:
      - "3000:3000"
      - "58081:58081"
      - "57081:57081"
    depends_on:
      - ekuiper
      - mqtt-broker
    volumes:
      - ./:/var/bin/hummingbird
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/configuration.toml:/etc/hummingbird-core/configuration.toml
    networks:
      - hummingbird
