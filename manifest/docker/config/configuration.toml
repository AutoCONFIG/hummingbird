[Writable]
LogLevel = 'INFO'
LogPath = 'hummingbird/logs/hummingbird-core.log'

[Service]
Host = '0.0.0.0'
ServerBindAddr = '' # Leave blank so default to Host value unless different value is needed.
Port = 58081
Protocol = 'http'
Timeout = 45000

[RpcServer]
Address = '0.0.0.0:57081'
UseTLS = false
CertFile = ''
KeyFile = ''

[Clients]
[Clients.Ekuiper]
Protocol = 'http'
Host = 'ekuiper'
Port = 9081

[WebServer]
Host = '0.0.0.0'
Port = 3000
Timeout = 120

[Databases]
[Databases.Metadata]
[Databases.Metadata.Primary]
Type = 'sqlite'
DataSource = 'hummingbird/db-data/core-data/core.db?_timeout=5000'
#Type = 'postgres'
#Dsn = 'host=postgres port=5432 user=hummingbird password=hummingbird dbname=hummingbird sslmode=disable TimeZone=Asia/Shanghai'
#Type = 'mysql'
#Dsn = 'root:123456@tcp(127.0.0.1:3306)/hummingbird?charset=utf8mb4&parseTime=True&loc=Local'


[Databases.Data]
[Databases.Data.Primary]
#Type = 'tstorage'
#DataSource = 'manifest/docker/db-data/tstorage-data/'
#Type = 'tdengine'
#Dsn = 'root:taosdata@ws(127.0.0.1:6041)/hummingbird'
Type = 'leveldb'
DataSource = 'manifest/docker/db-data/leveldb-core-data/'

[MessageQueue]
Protocol = 'tcp'
Host = 'mqtt-broker'
Port = 58090
Type = 'mqtt'
PublishTopicPrefix = 'eventbus/in'

# 翠鸟业务扩展（docs/water-platform-plan.md / docs/api-contract.md）
[ApplicationSettings]
# 设备直连接入协议 topic 前缀（docs/device-protocol.md）
# ekuiper 告警回调地址覆盖（docker 部署保持默认服务名；宿主机部署时改为 http://<宿主IP>:58082）
#EkuiperAlertCallbackUrl = 'http://hummingbird-core:58081'
# 微信小程序（不配置 AppId 时登录走开发模式 openid=dev_+code）
#WeChatAppId = ''
#WeChatAppSecret = ''
#WeChatTemplateId = ''      # 订阅消息模板 ID（一次性订阅）
#WeChatTemplateMode = 'oneoff'  # oneoff（默认，按配额）/ longterm（免配额）
#WeChatNotifyPage = 'pages/alarm/index'  # 订阅消息点击跳转页
